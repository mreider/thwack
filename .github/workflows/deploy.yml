name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Gate: pure-logic tests (assignment policy, doc-sharing gate) + typecheck.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker deps
        working-directory: worker
        run: npm ci
      - name: Typecheck
        working-directory: worker
        run: npx tsc --noEmit
      - name: Gate tests (assignment algorithm, doc gate)
        run: node --test tools/*_test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker deps
        working-directory: worker
        run: npm ci
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply thwack --remote
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
